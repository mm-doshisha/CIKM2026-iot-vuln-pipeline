load_module modules/ngx_http_modsecurity_module.so;
worker_processes auto;
events { worker_connections 1024; }
http {
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity/main.conf;
    server {
        listen 80;
        server_name _;
        location / {
            # Static 200 backend: we only care whether CRS BLOCKS (403), not what
            # the app returns. CRS phase-2 request rules run before the content
            # phase, so a blocked request yields 403 regardless of this backend.
            return 200 "ok\n";
        }
    }
}
